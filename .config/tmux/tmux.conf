set-option -g @plugin "tmux-plugins/tpm"
set-option -g @plugin "tmux-plugins/tmux-sensible"
set-option -g @plugin "tmux-plugins/tmux-yank"
set-option -g @plugin "christoomey/vim-tmux-navigator"

set-option -g extended-keys on
set-option -g extended-keys-format csi-u
set-option -g allow-passthrough on
set-option -g renumber-windows on

set-option -g mouse on
set-option -g history-limit 100000
set-option -g base-index 1
set-option -g pane-base-index 1

set-option -g detach-on-destroy off

set-option -ga terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set-option -g default-terminal "tmux-256color"
set-window-option -g cursor-style blinking-block
set-option -ga update-environment TERM
set-option -ga update-environment TERM_PROGRAM

unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

set-window-option -g mode-keys emacs

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind § display-popup -w 70% -h 70% -E "sesh picker -i -d"
bind ± run-shell "~/.config/tmux/scripts/cliamp-popup.sh"

set-option -g status 2
set-option -g status-format[0] "#[fill=terminal]"
set-option -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set-option -g status-position bottom
set-option -g status-justify absolute-centre
set-option -g status-interval 1
set-option -g status-left-length 60
set-option -g status-right-length 120

set-option -g status-style "bg=#2E3440,fg=#BBC3D4"

set-option -g status-left "#[fg=#242933,bg=#88C0D0,bold]  #S #[fg=#88C0D0,bg=#2E3440,nobold]#[default] #[fg=#81A1C1]#(~/.config/tmux/scripts/git-branch.sh '#{pane_current_path}')#[default] "
set-option -g status-right "#[fg=#81A1C1]#(~/.config/tmux/scripts/cliamp-status.sh)#[default]  #[fg=#242933,bg=#88C0D0,bold] %H:%M #[default]"

set-window-option -g window-status-format "#[fg=#81A1C1] #W #[default]"
set-window-option -g window-status-current-format "#[fg=#242933,bg=#81A1C1,bold] #W #[default]"
set-window-option -g window-status-separator ""

set-option -g pane-border-style "fg=#3B4252"
set-option -g pane-active-border-style "fg=#81A1C1"
set-option -g message-style "bg=#3B4252,fg=#ECEFF4"
set-option -g mode-style "bg=#434C5E,fg=#ECEFF4"
set-option -g popup-style "bg=#242933"
set-option -g popup-border-style "fg=#81A1C1"
set-option -g popup-border-lines rounded

run "~/.config/tmux/plugins/tpm/tpm"
